# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g
# Xcode betas are the norm on this team; the version check is advisory only.
kotlin.apple.xcodeCompatibility.nowarn=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# The installed SDK platform ships as "android-37.0" (Google's minor-versioned naming);
# the KMP android-library target resolves it more strictly than android.application does.
android.suppressUnsupportedCompileSdk=37,37.0

# Common tests run on the JVM target (fast, no Android runtime needed); AGP otherwise warns
# once per module that commonTest exists without Android host tests.
android.sync.suppressAgpWarnings=GENERIC

# Dictionary packs (docs/dictionaries/pack-catalogue.md). Where the companion app finds the
# downloadable packs: the catalogue.json asset of their release. Empty means this build offers no
# downloads and makes en_US.mkd from its sources; once set, builds download the published
# en_US.mkd instead. For device tests against a local server, override it with -P or in
# ~/.gradle/gradle.properties, e.g. http://localhost:8000/catalogue.json.
makeeb.packs.catalogueUrl=
