# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g
# Xcode betas are the norm on this team; the version check is advisory only.
kotlin.apple.xcodeCompatibility.nowarn=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# The installed SDK platform ships as "android-37.0" (Google's minor-versioned naming);
# the KMP android-library target resolves it more strictly than android.application does.
android.suppressUnsupportedCompileSdk=37,37.0

# Common tests run on the JVM target (fast, no Android runtime needed); AGP otherwise warns
# once per module that commonTest exists without Android host tests.
android.sync.suppressAgpWarnings=GENERIC
